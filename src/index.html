<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>eTransitBook · Operator portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem('etransitbook.theme');
        } catch {
          // Use the default theme when storage is disabled.
        }
        const root = document.documentElement;
        const preference = saved === 'dark' || saved === 'system' ? saved : 'light';
        const systemDark =
          preference === 'system' &&
          window.matchMedia?.('(prefers-color-scheme: light)').matches === false;
        root.dataset.themePreference = preference;
        root.dataset.theme = preference === 'dark' || systemDark ? 'dark' : 'light';
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
