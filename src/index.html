<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>eTransitBook · Operator portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem('etransitbook.theme');
        } catch {
          // The device preference also works when storage is disabled.
        }
        const root = document.documentElement;
        if (saved === 'dark' || saved === 'light') {
          root.dataset.themePreference = saved;
          root.dataset.theme = saved;
        } else {
          root.dataset.theme = window.matchMedia?.('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        }
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
