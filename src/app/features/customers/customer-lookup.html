<form (submit)="$event.preventDefault(); lookup()" (input)="changed()" novalidate>
  <app-field
    [id]="'booking-customer-phone'"
    label="Customer phone number"
    type="tel"
    placeholder="08012345678"
    [control]="phone()"
  />
  <button appButton type="submit" variant="secondary" #find [disabled]="match.isLoading()">
    Add Customer
  </button>
</form>
@if (selected(); as customer) {
  <p class="customer-result" role="status">
    <strong>{{ name(customer) }}</strong> · {{ formatPhone(customer.phoneNumber) }}
  </p>
} @else if (match.isLoading()) {
  <p class="customer-result" role="status">Looking up customer…</p>
} @else if (match.error()) {
  <div class="customer-result">
    <app-errors [messages]="errors(match.error())" />
    <button appButton variant="secondary" type="button" (click)="lookup()">Retry lookup</button>
  </div>
} @else if (match.hasValue()) {
  <p class="customer-result" role="status">No customer found for this number.</p>
}
@if (open(); as trigger) {
  <app-customer-form
    [trigger]="trigger"
    [phone]="formatPhone(phone().value)"
    (dismissed)="open.set(undefined)"
    (saved)="choose($event, find)"
    (duplicate)="duplicate($event)"
  />
}
