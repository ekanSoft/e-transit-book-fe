<div class="fare-workspace">
  <app-field
    class="base-fare"
    [id]="'trip-base-fare'"
    label="Default fare (₦)"
    labelHelp="Every passenger seat uses this fare unless you set a different fare for that seat."
    [control]="baseFare()"
    [hint]="hint"
  />
  <div class="fare-map">
    <div class="fare-map-heading">
      <h3>Special Seat Fares</h3>
      <app-field-help
        id="trip-per-seat-fare-help"
        label="Special Seat Fares"
        text="Select a passenger seat on the map to set a different fare for that seat."
      />
    </div>
    <app-seat-map
      [grid]="grid()"
      mode="select"
      [selected]="selected()"
      [seatDescriptions]="descriptions()"
      (cellPress)="select($event)"
    >
      <ng-template let-cell>
        @if (bySeat().has(cell.seatNumber.toLowerCase())) {
          <app-icon class="override-fare" name="wallet" />
        }
      </ng-template>
    </app-seat-map>
    @if (overrides().length) {
      <p class="fare-key muted"><app-icon name="wallet" /> Fare override</p>
    }
  </div>
  <div class="fare-override">
    @if (seat(); as label) {
      <app-field
        [id]="'trip-seat-fare'"
        [label]="'Fare for seat ' + label + ' (₦)'"
        [control]="seatFare"
      />
      <div class="fare-actions">
        <button appButton type="button" variant="secondary" (click)="apply()">Apply fare</button>
        @if (bySeat().has(label.toLowerCase())) {
          <button type="button" class="text-button" (click)="clear()">Use default fare</button>
        }
      </div>
    }
    <p class="muted override-count" role="status">
      {{ overrides().length }} {{ overrides().length === 1 ? 'override' : 'overrides' }}
    </p>
  </div>
</div>
